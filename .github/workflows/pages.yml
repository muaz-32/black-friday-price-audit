name: pages

# Rebuilds the dashboard from the committed summary and trends files and
# publishes it with GitHub Pages.
on:
  workflow_run:
    workflows: [snapshot, trends]
    types: [completed]
  push:
    branches: [main]
    paths: ["dashboard/**", "summary/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # a workflow_run event may carry an older commit

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The product pages are built from the newest state files; without them
      # the rest of the dashboard still builds.
      - name: Fetch product price histories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state
          names=$(gh release view state --json assets --jq '.assets[].name' 2>/dev/null || true)
          for kind in history info; do
            newest=$(echo "$names" | grep "^product-$kind-" | sort | tail -1 || true)
            if [ -n "$newest" ]; then gh release download state --dir state -p "$newest"; fi
          done

      - run: pip install duckdb

      - run: python -m dashboard.build --repo "${{ github.repository }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

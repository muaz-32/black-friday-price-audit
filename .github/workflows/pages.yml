name: pages

# Rebuilds the dashboard from the committed summary and trends files and
# publishes it with GitHub Pages.
on:
  workflow_run:
    workflows: [snapshot, trends]
    types: [completed]
  push:
    branches: [main]
    paths: ["dashboard/**", "summary/**", "research/validation/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A newer trigger waits for the running deploy instead of cancelling it: every
  # snapshot run, even one that skips, triggers a rebuild, and cancelling cost
  # finished builds. A waiting run checks out main, so it still has the latest data.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the build takes about 8 minutes, and a failed deploy is tried again a minute later
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # a workflow_run event may carry an older commit

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The product pages are built from the newest state files; without them
      # the rest of the dashboard still builds.
      - name: Fetch product price histories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state
          names=$(gh release view state --json assets --jq '.assets[].name' 2>/dev/null || true)
          for kind in history info; do
            newest=$(echo "$names" | grep "^product-$kind-" | sort | tail -1 || true)
            if [ -n "$newest" ]; then gh release download state --dir state -p "$newest"; fi
          done

      - run: pip install duckdb

      - run: python -m dashboard.build --repo "${{ github.repository }}"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # The deploy sometimes looks for the just-uploaded site before GitHub
      # lists it ("No artifacts named github-pages were found": 20 of 74 runs
      # from 22 to 25 Nov), though the artifact is there when listed later.
      # One more try a minute later.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

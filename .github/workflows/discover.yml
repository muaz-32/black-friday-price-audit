name: discover

# Probes stores/candidates.txt for domains that serve a public product feed
# (Shopify, then WooCommerce) and commits the updated store list. Run by hand
# after adding candidates.
on:
  workflow_dispatch:
    inputs:
      retry:
        description: "Also re-probe rejected domains whose reason matches this regular expression"
        default: "429"
      platforms:
        description: "Platforms to try, in order"
        default: "shopify,woocommerce"

permissions:
  contents: write

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          # The tip of the branch: a run queued behind another discovery run
          # must start from the store list that run committed.
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Probe candidates
        env:
          BF_USER_AGENT: "bf-price-audit/0.1 (+https://github.com/${{ github.repository }})"
          RETRY: ${{ inputs.retry }}
          PLATFORMS: ${{ inputs.platforms }}
        # The budget leaves time to save results before the job timeout; candidates
        # not reached are probed by the next run.
        run: python -m collector.discover --budget-minutes 200 --platforms "$PLATFORMS" ${RETRY:+--retry "$RETRY"}

      - name: Commit store list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stores/stores.csv stores/rejected.csv stores/candidates.txt
          git diff --cached --quiet || git commit -m "stores: discovery run $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((attempt * 5))
          done
          exit 1

name: trends

on:
  schedule:
    - cron: "37 * * * *" # hourly; the trending feed only shows what is rising right now
  workflow_dispatch:

permissions:
  contents: write # commits the CSVs under trends/

concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect search trends
        env:
          BF_USER_AGENT: "bf-price-audit/0.1 (+https://github.com/${{ github.repository }})"
        run: python -m collector.trends

      # Other workflows push to main too, so rebase and retry rather than fail.
      - name: Commit trends
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trends
          git diff --cached --quiet && exit 0
          git commit -q -m "trends: $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3 4; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((attempt * 5))
          done
          exit 1

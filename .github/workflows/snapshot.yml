name: snapshot

on:
  # Backup only: GitHub's scheduler has proved unreliable for this repository,
  # so an external cron service starts the runs through workflow_dispatch.
  schedule:
    - cron: "32 */6 * * *" # 15 minutes after the external trigger's slot
  workflow_dispatch:
    inputs:
      catalog:
        description: "Catalogue rows to write (auto: full in the first run of the UTC day)"
        type: choice
        options: [auto, full, recent]
        default: auto
      force:
        description: "Run even if a snapshot was taken in the last 4 hours"
        type: boolean
        default: false

permissions:
  contents: write # upload release assets, commit status/latest.json

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # Runs are started both by an external cron service and by GitHub's own
      # (unreliable) scheduler. Whichever comes second finds a recent snapshot
      # and stops here, so stores are not fetched twice for one slot.
      - name: Skip if this slot already has a snapshot
        id: fresh
        if: ${{ !inputs.force }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          try:
              run_id = json.load(open("status/latest.json"))["run_id"]
              last = datetime.strptime(run_id, "%Y%m%dT%H%M%SZ").replace(tzinfo=timezone.utc)
              hours = (datetime.now(timezone.utc) - last).total_seconds() / 3600
          except (OSError, KeyError, ValueError):
              hours = 99
          print(f"skip={'true' if hours < 4 else 'false'}")
          EOF

      # Read before the snapshot overwrites it: the dashboard summary compares
      # each run with the one before.
      - name: Note the previous snapshot
        id: prev
        run: echo "run_id=$(python -c "import json; print(json.load(open('status/latest.json'))['run_id'])" 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Take snapshot
        if: steps.fresh.outputs.skip != 'true'
        env:
          BF_VANTAGE: github-actions
          BF_USER_AGENT: "bf-price-audit/0.1 (+https://github.com/${{ github.repository }})"
          CATALOG: ${{ inputs.catalog || 'auto' }}
        # The budget leaves an hour before the job timeout for stores already
        # in flight, so a slow run ends with complete files, not a killed job.
        run: python -m collector.snapshot --catalog "$CATALOG" --budget-minutes 240 --status status/latest.json

      # Runs even when the snapshot step failed its coverage check: a partial
      # snapshot plus its runs file is still valid data.
      - name: Upload to this month's data release
        if: always() && steps.fresh.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-$(date -u +%Y-%m)"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "Snapshots $(date -u +%Y-%m)" \
            --notes "Raw snapshot files. See the README for the schema."
          gh release upload "$tag" data/prices-*.parquet data/catalog-*.parquet data/runs-*.parquet

      # After the upload, so the previous run's files fetched here are not
      # uploaded again. A failure here must not lose the snapshot's status commit.
      - name: Summarise for the dashboard
        if: always() && steps.fresh.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ steps.prev.outputs.run_id }}
        run: |
          run=$(ls data/prices-*.parquet | sed 's/.*prices-\(.*\)\.parquet/\1/' | sort | tail -1)
          if [ -n "$PREV" ] && [ "$PREV" != "$run" ]; then
            gh release download "data-${PREV:0:4}-${PREV:4:2}" --dir data \
              -p "prices-$PREV.parquet" -p "runs-$PREV.parquet" || PREV=""
          else
            PREV=""
          fi
          python -m collector.summarize --run "$run" ${PREV:+--prev "$PREV"}

      # The commit doubles as a heartbeat: GitHub disables scheduled workflows
      # in repositories with no activity for 60 days.
      - name: Commit run status
        if: always() && steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/latest.json summary
          git diff --cached --quiet || git commit -m "status: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
